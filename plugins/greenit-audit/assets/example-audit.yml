assumptions:
- id: H1
  statement: Le serveur est un 2U mutualisé dont les caractéristiques sont inconnues
    ; les valeurs Boavizta par défaut sont utilisées.
  value: 900
  unit: kg CO2e embarqué
  source_id: S26
  confidence: low
  impact_if_wrong: Si le serveur est plus petit ou plus récent, la part serveur peut
    diminuer fortement.
  status: à collecter
  owner: Ops / Achats
  due: '2026-12-15'
  evidence: Fiche serveur absente ; scénario Boavizta.
  evidence_status: sans preuve
- id: H2
  statement: Le PUE de l’hébergement est de 1,5.
  value: 1.5
  unit: ratio
  source_id: S26
  confidence: low
  impact_if_wrong: Un PUE de 1,2 réduit la part usage du serveur d’environ 20 %.
  status: à confirmer
  owner: Achats
  due: '2026-12-15'
  evidence: PUE contractuel absent ; scénario 1,5.
  evidence_status: sans preuve
- id: H3
  statement: 10 % des impacts du serveur sont alloués au service.
  value: 0.1
  unit: part
  source_id: S26
  confidence: medium
  impact_if_wrong: Une allocation à 5 % divise la part serveur par deux.
  status: hypothèse de travail
  owner: GreenIT
  due: '2026-12-01'
  evidence: Convention de travail ; matrice d’allocation non signée.
  evidence_status: convention
- id: H4
  statement: Le développement représente 30 h par développeur.
  value: 30
  unit: heures
  source_id: S36
  confidence: medium
  impact_if_wrong: Une durée double augmente la part développement.
  status: estimé
  owner: Tech lead
  due: '2026-12-01'
  evidence: Timesheet absent ; scénario 30 h.
  evidence_status: sans preuve
- id: H5
  statement: Chaque étudiant utilise le service 40 s sur la semaine.
  value: 40
  unit: secondes
  source_id: S36
  confidence: medium
  impact_if_wrong: Une utilisation plus longue augmente la part terminaux, mais elle
    reste faible si les appareils sont partagés.
  status: scénario
  owner: Produit
  due: '2026-12-01'
  evidence: Logs absents ; scénario 40 s.
  evidence_status: sans preuve
- id: H6
  statement: Le mix électrique français est de 51,9 g CO2e/kWh.
  value: 51.9
  unit: g CO2e/kWh
  source_id: S10
  confidence: high
  impact_if_wrong: Un mix plus carboné augmente la part usage.
  status: validé
  owner: GreenIT
  due: '2026-11-09'
  evidence: Base Empreinte [S10].
  evidence_status: preuve
- id: H7
  statement: 'Le volume réseau est dérivé de la page mesurée (1 595 Ko) : 0,001522
    Go fixe et 0,15262 Go mobile.'
  value: 0.154142
  unit: Go
  source_id: S42
  confidence: medium
  impact_if_wrong: Un volume plus élevé augmente la part réseau, mais elle reste secondaire
    dans ce scénario.
  status: dérivé mesuré
  owner: Tech lead
  due: '2026-11-09'
  evidence: web-metrics.json ; page mesurée.
  evidence_status: preuve
quality:
  limitations:
  - 'ACV screening : le rapport ne remplace pas une ACV complète avec revue critique.'
  - Caractéristiques réelles du serveur et PUE de l’hébergeur à collecter (H1, H2).
  - Fin de vie exclue faute de facteur spécifique ; impacts sociaux et effet rebond
    hors périmètre.
  - Le facteur réseau NegaOctet local couvre GWP, ADPe et ADPf ; sa licence interdit
    la redistribution.
  coverage: Screening sur les tiers 1–3, trois étapes de cycle de vie.
