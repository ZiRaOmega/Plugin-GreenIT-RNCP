schema_version: '1.0'
project:
  name: Service d’émargement Zone01 — démonstration
  client: Zone01 Normandie (cas pédagogique)
  version: '1.0'
  date: '2026-11-09'
  authors:
  - Équipe GreenIT RNCP39388
  context: Service web fictif permettant à 100 étudiants de s’émarger et à un membre
    du staff de consulter les présences pendant une semaine. Le cas sert à démontrer
    une ACV screening reproductible, pas à certifier un service réel.
functional_unit:
  description: Permettre à 100 étudiants de s’émarger dix fois et de consulter leurs
    présences, et à un membre du staff de consulter les présences, pendant une semaine,
    avec un serveur mutualisé.
  users: 100
  period_days: 7
  unit: semaine
  scenarios:
  - id: SC1
    description: Émargement étudiant
    actor: étudiant
    count_per_user: 10
    duration_s: 3
    requests: 2
    data_kb: 0.5
    device: smartphone
    network: 4G
    server_time_ms: 10
  - id: SC2
    description: Consultation étudiante
    actor: étudiant
    count_per_user: 1
    duration_s: 10
    requests: 5
    data_kb: 1595.305
    device: smartphone
    network: 4G
    server_time_ms: 10
  - id: SC3
    description: Consultation staff
    actor: staff
    count_per_user: 1
    duration_s: 20
    requests: 3
    data_kb: 1595.305
    device: laptop
    network: fixe
    server_time_ms: 10
scope:
  tiers:
  - 1
  - 2
  - 3
  lifecycle_stages:
  - Développement
  - Utilisation
  - Maintenance
  included:
  - Terminaux utilisateurs (fabrication et usage)
  - Réseau fixe et mobile
  - Serveur et hébergement (fabrication et usage)
  - Développement
  - Maintenance
  excluded:
  - Fabrication des bâtiments
  - Réseau inactif
  - Impacts sociaux
  - Effets rebond
  - Fin de vie faute de facteur spécifique
  cut_off_rules:
  - Aucun cut-off appliqué ; les flux non caractérisés sont signalés.
  allocation_method: 'Serveur mutualisé : 10 % des impacts alloués au service. Terminaux
    : allocation au temps d’usage du service.'
  include_embodied: true
  include_end_of_life: false
  geography: France
  grid_intensity_gco2e_per_kwh: 51.9
  grid_source_id: S10
stack:
  frontend: HTML/CSS/JavaScript vanilla
  backend: Python 3 stdlib (http.server)
  database: SQLite
  hosting: Serveur 2U mutualisé, région France
  ci_cd: GitHub Actions (fictif)
  third_parties: []
hardware:
  user_devices:
  - 100 smartphones 6 pouces
  - 1 laptop staff
  - 3 laptops développeurs
  servers:
  - 1 serveur 2U mutualisé
  network:
  - Réseau mobile 4G pour les étudiants
  - Réseau fixe pour le staff
constraints:
  budget_eur: 0
  deadline: '2026-11-09'
  security:
  - OWASP Top 10
  - moindre privilège
  - secrets hors code
  rgpd:
  - minimisation
  - durée de conservation
  - information des personnes
  accessibility:
  - RGAA 4.1.2
  - contrastes
  - labels
