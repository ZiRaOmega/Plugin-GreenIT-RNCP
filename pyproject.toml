[project]
name = "greenit-rncp39388"
version = "0.1.2"
description = "Bundle de plugins Claude Code pour audits GreenIT et preuves RNCP39388."
requires-python = ">=3.10"
authors = [{ name = "ZiRaOmega" }]
license = { text = "ViewOnly-1.0" }
dependencies = [
  "python-docx>=1.1",
  "python-pptx>=1.0.2",
  "openpyxl>=3.1",
  "matplotlib>=3.7",
  "Pillow>=10",
  "PyYAML>=6",
  "jsonschema>=4",
  "pypdf>=4",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "playwright>=1.40",
  "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.uv]
package = false
