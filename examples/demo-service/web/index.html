<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Émargement Zone01 — démonstration</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <img src="images/hero.png" width="900" height="600">
    <h1>Émargement Zone01</h1>
    <p>Démonstration volontairement perfectible pour l’audit GreenIT.</p>
  </header>
  <main>
    <section class="card">
      <h2>Émarger</h2>
      <form id="form">
        <input type="text" placeholder="Votre nom">
        <button type="submit">Valider</button>
      </form>
      <p id="status">Prêt.</p>
    </section>
    <section class="card">
      <h2>Présences</h2>
      <button id="refresh">Rafraîchir</button>
      <ul id="list"></ul>
    </section>
    <p><a href="https://example.org" target="_blank">Aide externe</a></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
